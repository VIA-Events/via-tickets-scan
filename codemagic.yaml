# Codemagic-Build für VIA Tickets Scan (iOS → TestFlight/App Store, Android → APK/AAB).
# Codemagic baut iOS auf macOS-Runnern in der Cloud – es braucht keinen eigenen Mac.
#
# Einmalig einrichten (Stand 19.10.2026, Codemagic „Personal Account" = eigenes Team):
#   1. App Store Connect → Benutzer und Zugriff → Integrationen → App Store Connect API → Team-Schlüssel „+":
#      Name „Codemagic", Rolle „App Manager", erzeugen, .p8 einmalig herunterladen, Issuer-ID + Key-ID notieren.
#      Vorher müssen die aktuellen Apple-Vereinbarungen akzeptiert sein (Developer Program License Agreement,
#      App-Store-Connect-Nutzungsbedingungen), sonst liefert die API nur 403.
#   2. Codemagic → Settings → Integrations → Developer Portal → Connect: Name `via_appstore`, Issuer-ID, Key-ID, .p8.
#   3. Codemagic → Settings → Code signing identities: iOS certificates → „Generate certificate" (Apple Distribution),
#      iOS provisioning profiles → „Fetch from Developer Portal" (Bundle `de.via.tickets.scan`, Typ App Store).
#      `ios_signing` unten holt dann genau diese Dateien; ohne sie bricht der Build mit „No matching profiles found" ab.
#   4. In App Store Connect die App „VIA Tickets Scan" mit Bundle-ID `de.via.tickets.scan` anlegen
#      (App-ID ist im Developer-Portal registriert).
#
# Die Plattform-Ordner android/ und ios/ müssen im Repo liegen (einmalig `flutter create .` – siehe README.md).

workflows:
  ios-appstore:
    name: iOS – TestFlight / App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: via_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.via.tickets.scan
      vars:
        APP_STORE_APPLE_ID: "0000000000" # Apple-ID der App aus App Store Connect (App-Informationen → Allgemein) eintragen.
    scripts:
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: |
          flutter analyze
          flutter test
      - name: Icons erzeugen
        script: dart run flutter_launcher_icons
      - name: Signierprofile anwenden
        script: xcode-project use-profiles
      - name: CocoaPods
        script: |
          cd ios
          pod install
      - name: iOS-Build (IPA)
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - VIA Einlass
        submit_to_app_store: false # nach erfolgreichem TestFlight-Test auf true setzen
      email:
        recipients:
          - info@via-jugendweihe.de
        notify:
          success: true
          failure: true

  android-release:
    name: Android – APK und App Bundle
    max_build_duration: 45
    instance_type: mac_mini_m2 # linux_x2 ist im Gratis-Plan nicht verfügbar
    environment:
      flutter: stable
      java: 17
      # Signatur: ohne hinterlegten Keystore signiert Flutter die APK mit dem Debug-Schlüssel – reicht zum Testen und
      # für die direkte Verteilung. Für den Play Store später unter Code Signing → Android einen Keystore hochladen
      # und hier eintragen:
      # android_signing:
      #   - via_android_keystore
    scripts:
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: |
          flutter analyze
          flutter test
      - name: Icons erzeugen
        script: dart run flutter_launcher_icons
      - name: Build
        script: |
          flutter build apk --release --build-number=$PROJECT_BUILD_NUMBER
          flutter build appbundle --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - info@via-jugendweihe.de
