# Codemagic-Build für VIA Tickets Scan (iOS → TestFlight/App Store, Android → APK/AAB).
# Codemagic baut iOS auf macOS-Runnern in der Cloud – es braucht keinen eigenen Mac.
#
# Einmalig in Codemagic (codemagic.io) einrichten:
#   1. Repository verbinden (GitHub/GitLab/Bitbucket oder beliebige Git-URL), Arbeitsverzeichnis `app/`.
#   2. Teams → Integrations → App Store Connect: API-Key aus App Store Connect (Users and Access → Integrations → App Store Connect API,
#      Rolle "App Manager") hochladen; Name hier: `via_appstore`.
#   3. Code Signing: "Automatic" mit dieser Integration – Codemagic erzeugt Zertifikat + Provisioning Profile selbst.
#   4. In App Store Connect die App "VIA Tickets Scan" mit Bundle-ID `de.via.tickets.scan` anlegen (Apple Developer → Identifiers vorher registrieren).
#
# Die Plattform-Ordner android/ und ios/ müssen im Repo liegen (einmalig `flutter create .` – siehe README.md).

workflows:
  ios-appstore:
    name: iOS – TestFlight / App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: via_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.via.tickets.scan
      vars:
        APP_STORE_APPLE_ID: "0000000000" # Apple-ID der App aus App Store Connect (App-Informationen → Allgemein) eintragen.
    working_directory: app
    scripts:
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: |
          flutter analyze
          flutter test
      - name: Icons erzeugen
        script: dart run flutter_launcher_icons
      - name: Signierprofile anwenden
        script: xcode-project use-profiles
      - name: CocoaPods
        script: |
          cd ios
          pod install
      - name: iOS-Build (IPA)
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - VIA Einlass
        submit_to_app_store: false # nach erfolgreichem TestFlight-Test auf true setzen
      email:
        recipients:
          - info@via-jugendweihe.de
        notify:
          success: true
          failure: true

  android-release:
    name: Android – APK und App Bundle
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      # Keystore in Codemagic unter Code Signing → Android hochladen (Referenz `via_android_keystore`).
      android_signing:
        - via_android_keystore
    working_directory: app
    scripts:
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Analyse und Tests
        script: |
          flutter analyze
          flutter test
      - name: Icons erzeugen
        script: dart run flutter_launcher_icons
      - name: Build
        script: |
          flutter build apk --release --build-number=$PROJECT_BUILD_NUMBER
          flutter build appbundle --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - info@via-jugendweihe.de
